name: Update meter data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: meter-data-update
  cancel-in-progress: false

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect and build dashboard data
        run: python dl.py

      - name: Commit updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add device_data dashboard-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update by GitHub Actions [skip ci]" && git push)
